name: Build native apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  CONEX_BACKEND_URL: ${{ vars.CONEX_BACKEND_URL || 'https://conex-assist-2--69x5p3t0.preview.emergentagent.com' }}

jobs:
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Decode signing keystore (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk CryptoConex.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: CryptoConex.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Publish
        shell: pwsh
        run: dotnet publish windows/CryptoConexPC/CryptoConexPC.csproj -c Release -o windows/publish -p:Version=$env:APP_VERSION -p:ConexBackendUrl="$env:CONEX_BACKEND_URL"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION windows\installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: windows/dist/CryptoConexSetup.exe }

  release:
    needs: [android, windows]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: ls -R out
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          tag_name: v${{ env.APP_VERSION }}
          name: Crypto Conex ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            out/android/CryptoConex.apk
            out/windows/CryptoConexSetup.exe
